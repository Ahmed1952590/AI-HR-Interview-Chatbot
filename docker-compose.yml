services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
